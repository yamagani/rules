# Local stack: `docker compose -f infra/docker-compose.yml up --build --wait`
# End-to-end: `pnpm e2e:compose` (builds, starts, reseeds, runs Playwright).
# Day-to-day development with hot reload: `pnpm db:up && pnpm dev`.
name: rules

# All JS services share one image; layers are cached so it is built once.
x-web: &web
  build:
    context: ..
    dockerfile: infra/node.Dockerfile
  image: rules-web:local

x-node-health: &node-health
  interval: 3s
  timeout: 3s
  retries: 40

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rules
      POSTGRES_PASSWORD: rules
      POSTGRES_DB: rules
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rules"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  rules-service:
    build: ../apps/api/rules-service
    environment:
      ENV: local
      DATABASE_URL: postgresql://rules:rules@postgres:5432/rules
      DATABASE_URL_UNPOOLED: postgresql://rules:rules@postgres:5432/rules
      AI_DEFAULT_PROVIDER: mock
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *node-health

  bff:
    <<: *web
    command: ["pnpm", "--filter", "@rules/bff", "start"]
    environment:
      RULES_SERVICE_URL: http://rules-service:8000
      PORT: "8787"
    ports: ["8787:8787"]
    depends_on:
      rules-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-health

  mfe-rules:
    <<: *web
    command: ["pnpm", "--filter", "@rules/mfe-rules", "preview", "--host", "0.0.0.0"]
    environment: { BFF_URL: "http://bff:8787" }
    ports: ["5174:5174"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5174/remoteEntry.js').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-health

  mfe-releases:
    <<: *web
    command: ["pnpm", "--filter", "@rules/mfe-releases", "preview", "--host", "0.0.0.0"]
    environment: { BFF_URL: "http://bff:8787" }
    ports: ["5175:5175"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5175/remoteEntry.js').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-health

  mfe-admin:
    <<: *web
    command: ["pnpm", "--filter", "@rules/mfe-admin", "preview", "--host", "0.0.0.0"]
    environment: { BFF_URL: "http://bff:8787" }
    ports: ["5176:5176"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5176/remoteEntry.js').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-health

  shell:
    <<: *web
    command: ["pnpm", "--filter", "@rules/shell", "preview", "--host", "0.0.0.0"]
    environment: { BFF_URL: "http://bff:8787" }
    ports: ["5173:5173"]
    depends_on:
      bff: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/mfe-manifest.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      <<: *node-health

volumes:
  pgdata:
