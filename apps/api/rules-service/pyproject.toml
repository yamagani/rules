[project]
name = "rules-service"
version = "0.1.0"
description = "Rules storage, versioning, RBAC and evaluation with the GoRules ZEN engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "pydantic-settings>=2.12",
  "sqlalchemy>=2.0.44",
  "alembic>=1.17",
  "psycopg[binary]>=3.2.12",
  "zen-engine>=2.1.3",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.14",
  "mypy>=1.18",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls real LLM providers; run with -m live and the provider key set"]
addopts = "-m 'not live'"
