# Phase 0 spike: deploy rules-service to the Vercel Python runtime against a Neon branch,
# then call /spike/evaluate and /health/db and record cold-start timings in the job summary.
# Runs only when the Vercel and Neon secrets exist; otherwise it reports what is missing.
name: Spike · zen-engine on Vercel

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/api/rules-service/**', '.github/workflows/spike-vercel.yml']

jobs:
  spike:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_RULES_SERVICE }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          for n in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID NEON_API_KEY NEON_PROJECT_ID; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "### Spike skipped: missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - name: Create Neon branch
        if: steps.secrets.outputs.ready == 'true'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: spike-${{ github.run_id }}
          api_key: ${{ env.NEON_API_KEY }}
      - name: Deploy to Vercel (preview)
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        working-directory: apps/api/rules-service
        run: |
          url=$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" \
            --env DATABASE_URL="${{ steps.neon.outputs.db_url_pooled }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Measure cold start and evaluate
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          cold=$(curl -s -o /tmp/cold.json -w '%{time_total}' -X POST "$url/spike/evaluate" \
            -H 'content-type: application/json' -d '{"applicant":{"age":30}}')
          warm=$(curl -s -o /tmp/warm.json -w '%{time_total}' -X POST "$url/spike/evaluate" \
            -H 'content-type: application/json' -d '{"applicant":{"age":12}}')
          db=$(curl -s "$url/health/db")
          {
            echo "### zen-engine on Vercel Python runtime"
            echo "- cold request: ${cold}s — $(cat /tmp/cold.json)"
            echo "- warm request: ${warm}s — $(cat /tmp/warm.json)"
            echo "- Neon: $db"
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q '"eligible":true' /tmp/cold.json
          grep -q '"eligible":false' /tmp/warm.json
      - name: Delete Neon branch
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: spike-${{ github.run_id }}
          api_key: ${{ env.NEON_API_KEY }}
